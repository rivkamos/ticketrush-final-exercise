<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicketRush – האיחוד – הופעת השנה</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="promo-banner" id="promo-banner">🔥 מכירה מוקדמת לחברות מועדון – מחיר מיוחד!</div>
  <header class="hero">
    <h1>האיחוד – הופעת השנה</h1>
    <p id="event-meta"></p>
    <p class="lineup">האיחוד · אורחים מיוחדים · ערב אחד בלבד</p>
  </header>

  <main>
    <section class="card">
      <h2>רכישת כרטיסים</h2>
      <label class="row">כמה כרטיסים?
        <input id="qty" type="number" min="1" value="2">
      </label>
      <label class="row check">
        <input id="member" type="checkbox"> אני חברת מועדון
      </label>
      <div class="total">סה"כ לתשלום: <strong id="total">—</strong></div>
      <button id="buy" type="button">לרכישה</button>
      <p id="msg" class="msg"></p>
    </section>
  </main>

  <footer class="site-footer">
    <a href="#">תקנון</a> · <a href="#">צרו קשר</a> · <a href="#">נגישות</a>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/events.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/format.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
