<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketRush Ops</title>
<style>
  :root {
    --bg:#0b0e1a; --panel:#131830; --panel2:#1a2040; --ink:#eef0ff; --muted:#8f97c2; --line:#262d57;
    --mission:#4c8dff; --bug:#ff4d5e; --feature:#34d399; --conflict:#ff9f43; --info:#8f97c2;
    --review:#a78bfa; --change:#facc15; --cherry:#ff6fa5; --security:#ff2d55; --finale:#f5c518;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(1200px 500px at 80% -10%, #1b2250 0%, var(--bg) 60%); color: var(--ink);
         font-family: "Segoe UI", "Heebo", Arial, sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line);
           position:sticky; top:0; background:rgba(11,14,26,.92); backdrop-filter: blur(8px); z-index:5; }
  .brand { font-weight:800; letter-spacing:.5px; font-size:1.1rem; }
  .brand small { display:block; font-weight:400; color:var(--muted); font-size:.8rem; letter-spacing:0; }
  .clock { text-align:center; }
  .clock .t { font-variant-numeric: tabular-nums; font-size:2.6rem; font-weight:800; line-height:1; direction:ltr; }
  .clock .l { color:var(--muted); font-size:.8rem; }
  .clock.amber .t { color:#ffc857; } .clock.red .t { color:#ff5c6c; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .bar { height:5px; background:var(--panel); }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#34d399,#facc15,#ff4d5e); transition: width 1s linear; }
  .stats { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
  .chip { background:var(--panel); border:1px solid var(--line); padding:4px 10px; border-radius:999px; }
  main { max-width: 860px; margin: 0 auto; padding: 22px 20px 80px; }
  .perm { display:none; background:var(--panel2); border:1px dashed #4a5398; border-radius:14px; padding:12px 16px; margin-bottom:18px;
          align-items:center; justify-content:space-between; gap:12px; }
  .perm.show { display:flex; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:8px 14px; background:#3b4590; color:#fff; }
  button:hover { filter:brightness(1.15); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:60px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px;
          position:relative; overflow:hidden; animation: slide .5s ease; }
  .card::before { content:""; position:absolute; inset-block:0; inset-inline-start:0; width:6px; background:var(--c, var(--info)); }
  .card.new { box-shadow: 0 0 0 2px var(--c), 0 0 40px -8px var(--c); }
  @keyframes slide { from { transform: translateY(-14px); opacity:0; } to { transform:none; opacity:1; } }
  .meta { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.82rem; margin-bottom:6px; }
  .tag { color:#0b0e1a; background:var(--c); font-weight:700; padding:2px 10px; border-radius:999px; font-size:.75rem; }
  .card h2 { margin:0 0 10px; font-size:1.25rem; }
  .card p { margin:8px 0; line-height:1.65; }
  .card ul { margin:8px 0; padding-inline-start:22px; line-height:1.7; }
  code { direction:ltr; unicode-bidi:embed; background:#0b0e1a; border:1px solid var(--line); padding:1px 6px; border-radius:6px;
         font-family: Consolas, "SF Mono", monospace; font-size:.88em; color:#cde3ff; }
  .hint { margin-top:10px; }
  .hintbox { margin-top:8px; background:#0b0e1a; border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:#cde3ff;
             font-family: Consolas, monospace; direction:ltr; text-align:left; font-size:.9rem; }
  .k-mission{--c:var(--mission)} .k-bug{--c:var(--bug)} .k-feature{--c:var(--feature)} .k-conflict{--c:var(--conflict)}
  .k-info{--c:var(--info)} .k-review{--c:var(--review)} .k-change{--c:var(--change)} .k-cherry{--c:var(--cherry)}
  .k-security{--c:var(--security)} .k-finale{--c:var(--finale)}
  /* התראה צפה */
  #toast { position:fixed; inset-inline:0; top:-220px; display:flex; justify-content:center; transition: top .5s cubic-bezier(.2,1.2,.3,1); z-index:20; pointer-events:none; }
  #toast.show { top:84px; pointer-events:auto; }
  #toast .box { background:var(--panel2); border:2px solid var(--c); border-radius:18px; padding:16px 22px; min-width:320px; max-width:92vw;
                box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 50px -6px var(--c); cursor:pointer; }
  #toast .tt { font-size:.8rem; color:var(--c); font-weight:800; letter-spacing:1px; }
  #toast .tb { font-size:1.2rem; font-weight:700; margin-top:4px; }
  footer { position:fixed; bottom:0; inset-inline:0; padding:8px 20px; background:rgba(11,14,26,.92); border-top:1px solid var(--line);
           color:var(--muted); font-size:.8rem; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="brand">🎟️ TicketRush Ops<small id="who">—</small></div>
  <div class="clock" id="clock"><div class="t" id="t">60:00</div><div class="l">זמן שנשאר עד פתיחת המכירה</div></div>
  <div class="stats"><span class="chip" id="s-alerts">התראות: 0</span><span class="chip" id="s-wt">🌳 worktrees: 0</span></div>
</header>
<div class="bar"><i id="prog"></i></div>

<div id="toast"><div class="box" id="toastbox"><div class="tt" id="tt"></div><div class="tb" id="tb"></div></div></div>

<main>
  <div class="perm" id="perm">
    <span>🔔 רוצה שההתראות יקפצו גם מעל החלונות האחרים? אפשרי התראות לדף הזה.</span>
    <button id="permbtn">הפעלת התראות</button>
  </div>
  <div id="feed"><div class="empty">ממתינים להתראה הראשונה…</div></div>
</main>
<footer>השאירי את הלשונית הזו פתוחה. התראות חדשות יופיעו כאן אוטומטית ויישמרו גם בתיקיית ALERTS/. אפשר לקרוא אותן שוב בכל רגע.</footer>

<script>
(function () {
  var KIND = { mission:'משימה', bug:'באג!', feature:'פיצ\'ר חדש', conflict:'מיזוג', info:'אזעקה', review:'סקירה', change:'שינוי דרישות', cherry:'תיקון נקודתי', security:'אבטחה', finale:'סיום' };
  var seen = {}, firstLoad = true, offset = 0, hintCache = {}, audioCtx = null, baseTitle = document.title, flashTimer = null;

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
  function md(text) {
    var out = [], inList = false;
    text.split('\n').forEach(function (line) {
      if (/^- /.test(line)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + inline(line.slice(2)) + '</li>'); }
      else { if (inList) { out.push('</ul>'); inList = false; } if (line.trim()) out.push('<p>' + inline(line) + '</p>'); }
    });
    if (inList) out.push('</ul>');
    return out.join('');
  }

  function beep(urgent) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var seq = urgent ? [880, 660, 880] : [660, 880];
      seq.forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
        var t0 = audioCtx.currentTime + i * 0.22;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.start(t0); o.stop(t0 + 0.22);
      });
    } catch (e) {}
  }

  function colorOf(kind) { return getComputedStyle(document.documentElement).getPropertyValue('--' + kind).trim() || '#8f97c2'; }

  function toast(a) {
    var box = document.getElementById('toastbox');
    box.style.setProperty('--c', colorOf(a.kind));
    document.getElementById('tt').textContent = (KIND[a.kind] || 'התראה').toUpperCase() + ' · דקה ' + a.atMin;
    document.getElementById('tb').textContent = a.title;
    var t = document.getElementById('toast'); t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('show'); }, 7000);
  }
  document.getElementById('toastbox').onclick = function () { document.getElementById('toast').classList.remove('show'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  function flashTitle(text) {
    var on = true; clearInterval(flashTimer);
    flashTimer = setInterval(function () { document.title = on ? '🔔 ' + text : baseTitle; on = !on; }, 800);
    window.addEventListener('focus', function stop() { clearInterval(flashTimer); document.title = baseTitle; window.removeEventListener('focus', stop); });
  }

  function systemNotify(a) {
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('TicketRush · ' + a.title, { body: 'פתחי את המוקד לפרטים', requireInteraction: false }); } catch (e) {}
  }

  function card(a, isNew) {
    var d = document.createElement('div');
    d.className = 'card k-' + a.kind + (isNew ? ' new' : '');
    d.id = 'a' + a.id;
    d.innerHTML = '<div class="meta"><span class="tag">' + esc(KIND[a.kind] || 'התראה') + '</span><span>דקה ' + a.atMin + '</span><span>· התראה ' + a.id + '</span></div>' +
      '<h2>' + esc(a.title) + '</h2>' + md(a.body) +
      (a.hasHint ? '<div class="hint"><button class="ghost" data-id="' + a.id + '">💡 רמז (נרשם)</button><div class="hintbox" style="display:none"></div></div>' : '');
    if (isNew) setTimeout(function () { d.classList.remove('new'); }, 6000);
    var b = d.querySelector('button[data-id]');
    if (b) b.onclick = function () {
      var box = d.querySelector('.hintbox');
      if (box.style.display === 'block') { box.style.display = 'none'; return; }
      if (hintCache[a.id]) { box.textContent = hintCache[a.id]; box.style.display = 'block'; return; }
      fetch('/api/hint?id=' + a.id).then(function (r) { return r.json(); }).then(function (j) { hintCache[a.id] = j.hint; box.textContent = j.hint; box.style.display = 'block'; });
    };
    return d;
  }

  function fmt(ms) { if (ms < 0) ms = 0; var s = Math.floor(ms / 1000), m = Math.floor(s / 60); return (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }

  var last = null;
  function paint() {
    if (!last) return;
    var elapsedSim = (Date.now() + offset - last.startedAt) * last.speed;
    var total = last.durationMin * 60000;
    var left = total - elapsedSim;
    var clock = document.getElementById('clock');
    document.getElementById('t').textContent = left >= 0 ? fmt(left) : '-' + fmt(-left);
    clock.className = 'clock' + (left < 10 * 60000 ? ' red' : left < 20 * 60000 ? ' amber' : '');
    document.getElementById('prog').style.width = Math.min(100, Math.max(0, elapsedSim / total * 100)) + '%';
  }

  function poll() {
    fetch('/api/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      last = s; offset = s.now - Date.now();
      document.getElementById('who').textContent = s.id;
      document.getElementById('s-alerts').textContent = 'התראות: ' + s.alerts.length;
      document.getElementById('s-wt').textContent = '🌳 worktrees שזוהו: ' + s.worktreesSeen;
      var feed = document.getElementById('feed');
      var fresh = s.alerts.filter(function (a) { return !seen[a.id]; });
      if (fresh.length) {
        var empty = feed.querySelector('.empty'); if (empty) empty.remove();
        fresh.sort(function (x, y) { return x.id - y.id; }).forEach(function (a) {
          seen[a.id] = true;
          var isNew = !firstLoad || (s.now - a.firedAt < 15000);
          feed.insertBefore(card(a, isNew), feed.firstChild);
          if (isNew) { toast(a); beep(a.kind === 'bug' || a.kind === 'security'); systemNotify(a); flashTitle(a.title); }
        });
      }
      firstLoad = false; paint();
    }).catch(function () {
      document.getElementById('who').textContent = 'אין חיבור לשרת – הרץ שוב: node start.js';
    });
  }

  var perm = document.getElementById('perm');
  if ('Notification' in window && Notification.permission === 'default') perm.classList.add('show');
  document.getElementById('permbtn').onclick = function () {
    try { Notification.requestPermission().then(function () { perm.classList.remove('show'); beep(false); }); } catch (e) {}
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  };
  document.body.addEventListener('click', function () { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }, { once: true });

  poll(); setInterval(poll, 1000); setInterval(paint, 250);
})();
</script>
</body>
</html>
